[workspace]
resolver = "2"

[package]
name = "waterui-dew"
version = "0.2.1"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/dew"
description = "Dew: WaterUI's embedded-first CPU rendering backend"
keywords = ["ui", "backend", "waterui", "embedded", "gui"]
categories = ["gui", "embedded"]

[features]
default = ["system-fonts", "progress", "host", "gestures"]
# Host-side surfaces: the in-memory framebuffer (`BufferDisplay`), the
# reference `HostBoard`, and PNG snapshot export. Firmware builds
# (default-features = false) drop them along with the PNG encoder they pull
# in — a flash image has no use for either.
host = ["vello_cpu/png"]
# Embedded-device simulator: a desktop window standing in for the panel of
# an embedded device, running the full dew pipeline natively (winit + softbuffer).
embedded-simulator = [
    "host",
    "dep:winit",
    "dep:softbuffer",
    "dep:executor-core",
    "dep:native-executor",
    # The simulator owns a winit loop, so it drives the same cooperative
    # executor the firmware entry point uses.
    "dep:async-executor",
]
# ESP-IDF runtime entry: a complete firmware main-loop for ESP32-class
# chips; generated harnesses call `espidf::run` and nothing else.
espidf = [
    "dep:esp-idf-svc",
    "dep:log",
    "dep:waterui",
    "dep:executor-core",
    "dep:native-executor",
    "native-executor/polyfill",
    "dep:async-executor",
]
# Desktop font enumeration; firmware targets disable this and register
# bundled fonts into the parley FontContext instead.
system-fonts = ["parley/system"]
# Interaction metadata: `Metadata<GestureObserver>` (tap / long-press / drag /
# pinch / rotate) and `Metadata<OnEvent>` (hover enter / move / exit). The
# recognizer state machines come from `waterui-backend-core`, which pulls the
# `waterui` facade the gesture event payloads are defined in — the same reason
# `progress` is gated. A firmware build that drops this feature keeps a
# pointer-driven UI (buttons, toggles, sliders, tabs all route through
# `PointerRouter`); what it loses is the `.gesture(...)` / `.on_hover(...)`
# modifier surface, and a view carrying that metadata fails fast in dispatch
# rather than rendering as if the handler were wired.
gestures = ["waterui-backend-core/gestures"]
# The Progress widget's config type lives in the `waterui` facade crate,
# which pulls the visual component stack (and thus a GPU graphics build).
# Gating it keeps the lean firmware graph (default-features = false) free of
# the facade; desktop and simulator builds enable it by default.
progress = ["dep:waterui"]

[dependencies]
accesskit = "0.25"
smallvec = "1.16"
waterui-core = "0.3.1"
waterui-backend-core = { version = "0.1.1", default-features = false }
waterui-controls = "0.3.1"
waterui-graphics = { version = "0.4.0", default-features = false, features = ["cpu-scene"] }
waterui-layout = "0.3.1"
# Navigation is `no_std` and pulls no renderer of its own, so it stays in the
# lean firmware graph: a device with two screens needs a way between them.
waterui-navigation = "0.3.1"
# Default features off: the shape crate's default is a wgpu-backed morph
# renderer, and dew's graph is GPU-free by design.
waterui-shape = { version = "0.1.1", default-features = false }
# `font-collection` for the one `parley` collection this renderer shapes with
# and installs into the environment. Not `system-fonts`: the faces come from
# the board, and a firmware build has no system font source at all.
waterui-text = { version = "0.4.0", features = ["font-collection"] }
nami = "0.11.2"
# FrameWork and ChipBudget serialize into the performance report.
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
parley = { version = "0.11", default-features = false, features = ["libm"] }
kurbo = "0.13"
peniko = "0.6"
skrifa = "0.47.0"
# Default features deliberately off: they include the PNG encoder, which
# only the host-side snapshot surface needs — see the `host` feature.
vello_cpu = { version = "0.2.0", default-features = false, features = [
    "std",
    "text",
    "u8_pipeline",
    "f32_pipeline",
] }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
executor-core = { version = "0.7.1", features = ["std"], optional = true }
native-executor = { version = "0.8.0", optional = true }
async-executor = { version = "1", optional = true }
log = { version = "0.4", optional = true }
waterui = { version = "0.4.0", default-features = false, optional = true }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "0.52", optional = true }

[dev-dependencies]
waterui-testing = "0.4.0"
# The theme installation API (`Theme`, `ColorSettings`, `FontSettings`) and the
# authoring prelude every test view tree is written in live in the facade
# crate, and nothing below it exposes them. The library reaches the facade only
# through the optional `progress` feature, so without this entry the test
# targets compile in exactly one feature shape — the default one — and the
# firmware shape's tests do not build at all. Tests are host-side and never
# enter a flash image, so depending on the facade here costs the firmware graph
# nothing.
waterui = { version = "0.4.0", default-features = false }
# Scene content, for the tests that prove `Scene2D` drawings render on dew's
# CPU rasterizer unchanged. Test-only on purpose: dew draws a scene through
# the engine-neutral contract and never needs to know which component produced
# it, so the library gains no component dependency. These crates currently ask
# `waterui-graphics` for its `gpu` feature (`CanvasImage` decodes through it),
# which is why they are confined to dev-dependencies — the firmware graph,
# built from the library alone, stays GPU-free.
waterui-canvas = "0.1.2"
waterui-svg = "0.3.0"
# A formula is the scene content that has something to say about itself: it
# answers `SceneContent::accessibility_label` with itself spoken as a sentence,
# which is what proves dew's scene leaf publishes a content-supplied name rather
# than a bare unnamed image. Test-only for the same reason as the two crates
# above.
waterui-math = "0.1.0"
# The component issue #180 is actually about: an interactive chart wraps its
# canvas in `Metadata<GestureObserver>` and `Metadata<OnEvent>`, and every one
# of those wrappers used to abort dew's dispatch. Test-only, like the scene
# crates above and for the same reason.
waterui-chart = "0.2.0"
# Tracks the version vello_cpu links, or `Level` is a different type on either side.
fearless_simd = { version = "0.4", features = ["force_support_fallback"] }
executor-core = { version = "0.7.1", features = ["std"] }
native-executor = "0.8.0"
# The performance simulation emits its report as serialized TOML rather than
# hand-concatenated lines.
toml = "1.1.5"

# Every integration test declares the feature shape it needs, the way the
# simulator example does. `host` buys the in-memory framebuffer (`HostBoard`,
# `BufferDisplay`) and the PNG snapshot entry these tests inspect; `progress`
# buys the Progress widget's config type, without which dew has no handler to
# dispatch a progress bar to. A test that needs neither — `fallback_probe`, the
# scalar-rasterizer probe — is left to auto-discovery and runs in every shape,
# firmware included.
[[test]]
name = "accessibility"
required-features = ["host"]

[[test]]
name = "dispatch_views"
required-features = ["host"]

[[test]]
name = "form_render"
required-features = ["host", "progress"]

[[test]]
name = "interaction_metadata"
required-features = ["host", "gestures"]

[[test]]
name = "interaction_without_gestures"
required-features = ["host", "system-fonts"]

[[test]]
name = "navigation_render"
required-features = ["host"]

[[test]]
name = "scene_render"
required-features = ["host"]

[[test]]
name = "shape_render"
required-features = ["host"]

[[test]]
name = "smoke_frame"
required-features = ["host"]

[[test]]
name = "tabs_render"
required-features = ["host"]

# The embedded simulation models a panel bus and a flash-bundled font, so it
# wants no host surface at all — only the payment-progress bar its work and
# memory budgets are calibrated around. It is the one integration test that
# runs in the firmware shape (`--no-default-features --features progress`),
# which is the point of it.
[[test]]
name = "vending_performance"
required-features = ["progress"]

[[example]]
name = "watch_sim"
required-features = ["embedded-simulator"]

[lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
clippy.undocumented_unsafe_blocks = "warn"
clippy.multiple_crate_versions =  { level = "allow", priority = 1 }

# The WaterUI packages above come from crates.io, so this repository builds
# against the same released APIs its users get. The third-party pins below are
# the framework's own: the published framework crates were built with these
# forks, and dropping them here would run this repository's render tests
# through different code than the framework runs.
[patch.crates-io]
waterui-chart = { git = "https://github.com/water-rs/chart", rev = "4877ca036d5fdaabc9930357223fcb2f86df6fbb" }
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }

# `waterui-testing` pulls these renderers into the test graph, so a graph that
# took them from the registry would build released copies against a
# `Layout::place` signature they predate. Both resolve from the commits that
# implement the proposal-aware contract this crate now requires. Drop these
# entries once releases carry the contract.
hydrolysis = { git = "https://github.com/water-rs/hydrolysis", rev = "452aea58b2e63edc889f1c8a2f3f8f7f1a4c6bb0" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "14a35e3ef69ced36557a3c7ab11d52e0afb53ad5" }

# The proposal-aware layout contract (water-rs/dew#6, waterui#957/#964) lives
# on the framework's layout-contract branch and is not yet released; until
# releases land on crates.io the framework crates resolve from that rev.
# Every `waterui-*` member of that repository is pinned to the same revision
# so the graph carries exactly one copy of each — a registry crate beside its
# git twin would compile duplicate `View`/`Resolvable` types. Drop the
# entries and bump the requirements once the releases carry them.
waterui = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "58eea5c81e0d7bfe6f6902f638175650637d7684" }
