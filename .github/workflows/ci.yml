name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # `system-fonts` reaches the platform font service through fontconfig,
        # whose headers the fontique backend needs to build. `libegl-dev`
        # carries egl.pc for khronos-egl (xcap -> waterkit-screen under
        # --all-features); gbm/pipewire/xcb cover the rest of that screen-
        # capture graph, and `libva-dev` is the pkg-config name cros-libva
        # (waterkit-codec -> waterui-image -> waterui-media) probes for. The
        # noto fonts are faces, not headers: system-fonts is a default
        # feature, so the test leg enumerates real fonts and a runner without
        # CJK and Latin faces shapes coverage tests to `.notdef`.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libegl-dev libgbm-dev \
            libpipewire-0.3-dev libva-dev libxcb1-dev \
            fonts-noto-core fonts-noto-cjk
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        # shaderloom compiles the WGSL waterui-graphics ships to DXIL on
        # Windows; the runner image does not ship dxc.
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - name: Verify DirectX Shader Compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: dxc --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # Every feature on covers the default shape plus the opt-in surfaces —
      # `embedded-simulator` and `espidf` compile to their host-side or empty
      # forms on a desktop target.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --all-features --profile ci
      # The firmware shape is a first-class configuration, not a degraded one:
      # `--all-targets` is the whole point — the library alone is clean here,
      # it is the test targets a lean build also has to compile.
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo nextest run --locked --no-default-features --profile ci

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The floor is whatever `Cargo.toml` declares, read here rather than
      # written twice: a hardcoded version in CI drifts from the manifest and
      # then gates a number nobody declared.
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Installing a toolchain is not building with it: the action only
          # sets the rustup default, and this repository's
          # `rust-toolchain.toml` overrides the default for every cargo
          # invocation inside the checkout. `RUSTUP_TOOLCHAIN` is the one
          # override that beats the file.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libegl-dev libgbm-dev \
            libpipewire-0.3-dev libva-dev libxcb1-dev \
            fonts-noto-core fonts-noto-cjk
      - uses: Swatinem/rust-cache@v2
      # Proof in the log that the floor is what compiled, so a later change to
      # the pin or the action cannot quietly make this a second stable run.
      - name: Show the toolchain this job builds with
        run: rustc --version && cargo --version
      # The shipped artifact is what MSRV bounds: dev-dependencies may
      # legitimately require newer, so check the package targets only.
      - run: cargo check --locked --all-features
