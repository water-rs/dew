name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # `system-fonts` reaches the platform font service through fontconfig,
        # whose headers the fontique backend needs to build.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # Every feature on covers the default shape plus the opt-in surfaces —
      # `embedded-simulator` and `espidf` compile to their host-side or empty
      # forms on a desktop target.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --all-features --profile ci
      # The firmware shape is a first-class configuration, not a degraded one:
      # `--all-targets` is the whole point — the library alone is clean here,
      # it is the test targets a lean build also has to compile.
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo nextest run --locked --no-default-features --profile ci
