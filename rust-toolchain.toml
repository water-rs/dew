# The toolchain is a property of this repository, not of whoever checked it out.
#
# CI lints and tests on `stable`, and clippy's findings differ between channels
# in both directions. Without this file, a contributor whose rustup default is
# nightly gets a result that does not match CI: a green local
# `cargo clippy -- -D warnings` can come back red in CI, and the reverse.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
